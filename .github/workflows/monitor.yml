name: LinkedIn Activity Monitor

on:
  schedule:
    - cron: "0 6 * * 1"

  workflow_dispatch:
    inputs:
      dry_run:
        description: "Use mock data (no API calls)"
        required: false
        default: "false"
        type: boolean
      send_email:
        description: "Send email after running"
        required: false
        default: "false"
        type: boolean

jobs:
  run-monitor:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check bi-weekly schedule
        if: github.event_name == 'schedule'
        id: biweekly
        run: |
          WEEK=$(date +%V | sed 's/^0//')
          if (( WEEK % 2 == 0 )); then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "Even week ($WEEK) — skipping."
          else
            echo "skip=false" >> $GITHUB_OUTPUT
            echo "Odd week ($WEEK) — running."
          fi

      - name: Run monitor
        if: steps.biweekly.outputs.skip != 'true'
        env:
          BW_API_KEY: ${{ secrets.BW_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_RECIPIENTS: ${{ secrets.EMAIL_RECIPIENTS }}
        run: |
          FLAGS=""
          if [ "${{ github.event.inputs.dry_run }}" == "true" ]; then
            FLAGS="$FLAGS --dry-run"
          fi
          if [ "${{ github.event.inputs.send_email }}" == "true" ]; then
            FLAGS="$FLAGS --email"
          fi
          python monitor.py $FLAGS

      - name: Commit data.json to repo
        if: steps.biweekly.outputs.skip != 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --staged --quiet || git commit -m "Update data.json [$(date +%Y-%m-%d)]"
          git push

      - name: Upload HTML report as artifact
        if: steps.biweekly.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: linkedin-report-${{ github.run_id }}
          path: report_*.html
          retention-days: 90
 }}
